name: Publish kart game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Version game assets
        run: python3 tools/stamp-version.py "$GITHUB_SHA"
      - name: Check static assets
        run: python3 tools/verify-site.py
      - name: Check face and corridor prototype
        run: node tools/verify-lab.mjs
      - name: Check real campus corridor race and ghost
        run: node tools/verify-courtyard.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload game
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v4
